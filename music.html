<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="player-container">
    <div class="player-card">
      <h2>MP3 Audio Player</h2>

      <audio id="audio-player"></audio>

      <div class="track-details">
        <p id="track-title">c:\Users\DELL\Downloads\Tum Hi Ho Aashiqui 2 320 Kbps.mp3</p>
      </div>

      <div class="controls">
        <button id="play-btn" class="btn play-btn" disabled>Play</button>
      </div>

      <div class="file-upload">
        <label for="mp3-file" class="btn upload-btn">Choose MP3 File</label>
        <input type="file" id="mp3-file" accept="audio/mp3, audio/*">
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
